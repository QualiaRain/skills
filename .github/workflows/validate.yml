name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lint the skill pack
        run: python3 validate.py
      - name: gh-safe-comment-edit tests
        run: python3 test_ghsafe.py
        working-directory: skills/gh-safe-comment-edit
